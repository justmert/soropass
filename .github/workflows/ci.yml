name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly — re-verify the living compatibility matrix against current browsers.
    - cron: '0 6 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck

  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  build:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  # ⭐ S07 (YK-433) — virtual-authenticator CI: real WebAuthn create→get
  # ceremonies against CDP virtual authenticators (Chromium + Edge), each
  # round-trip verified via p256.verify. Regenerates apps/matrix/data/ci.<date>.json.
  matrix-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK core (the harness verifies against it)
        run: pnpm --filter @soropass/core build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Edge (best-effort)
        run: pnpm exec playwright install msedge || echo "msedge unavailable on this runner"
      - name: Run the virtual-authenticator grid (p256.verify round-trip gate)
        run: pnpm matrix:ci
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-ci-data
          path: apps/matrix/data/ci.*.json
          if-no-files-found: error

  # The living mechanism. Re-pull BCD, merge the fresh virtual-authenticator
  # results (matrix-ci), regenerate the dated snapshot + diff, and open a PR so
  # the matrix accrues real dated history. Runs only on the weekly cron (not on
  # every push), and opening the PR requires the repo setting "Allow GitHub
  # Actions to create and approve pull requests" (Settings → Actions → General).
  matrix-refresh:
    needs: [matrix-ci]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the fresh virtual-authenticator results from matrix-ci
        uses: actions/download-artifact@v8
        with:
          name: matrix-ci-data
          path: apps/matrix/data
      - name: Refresh dated snapshot + diff (pull → build → diff → docs export)
        run: pnpm --filter @soropass/matrix matrix:refresh
        env:
          # Export the fresh JSON straight into the docs site's /public so the
          # committed data is what docs.soropass.dev serves after its redeploy.
          DOCS_PUBLIC_DIR: ${{ github.workspace }}/apps/docs-fuma/public
      - name: Publish the freshness report to the run summary
        run: |
          {
            echo "## Living compatibility matrix — weekly re-verification"
            echo
            cat apps/matrix/rendered/matrix-diff.md
          } >> "$GITHUB_STEP_SUMMARY"
      # Commit the refreshed data directly to main. The previous auto-PR never
      # landed: its add-paths listed the gitignored apps/matrix/rendered/*.md,
      # git add fataled on the pathspec, and continue-on-error swallowed the
      # failure every week. A direct data commit also redeploys the docs site
      # (Vercel builds on push), which is what keeps /docs/compatibility fresh.
      - name: Commit the refreshed matrix data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/matrix/data apps/docs-fuma/public/matrix
          if git diff --cached --quiet; then
            echo "matrix unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore(matrix): weekly living-matrix refresh"
          git pull --rebase origin main
          git push origin HEAD:main

  # NOTE: there is no docs deploy job here — the docs front-end is a separate
  # designed site, pushed independently. The matrix data (apps/matrix/data/*.json)
  # is committed back by matrix-refresh above; the docs site fetches the exported
  # JSON (run `pnpm --filter @soropass/matrix docs:export` into its /public).
